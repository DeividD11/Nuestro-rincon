name: Security UI tests (isolated Supabase)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NR_E2E_PROJECT_REF: ${{ secrets.NR_E2E_PROJECT_REF }}
      NR_E2E_SUPABASE_URL: ${{ secrets.NR_E2E_SUPABASE_URL }}
      NR_E2E_PUBLISHABLE_KEY: ${{ secrets.NR_E2E_PUBLISHABLE_KEY }}
      NR_E2E_ACCOUNT_A_USERNAME: ${{ secrets.NR_E2E_ACCOUNT_A_USERNAME }}
      NR_E2E_ACCOUNT_A_PASSWORD: ${{ secrets.NR_E2E_ACCOUNT_A_PASSWORD }}
      NR_E2E_ACCOUNT_A_DISPLAY_NAME: ${{ secrets.NR_E2E_ACCOUNT_A_DISPLAY_NAME }}
      NR_E2E_ACCOUNT_B_USERNAME: ${{ secrets.NR_E2E_ACCOUNT_B_USERNAME }}
      NR_E2E_ACCOUNT_B_PASSWORD: ${{ secrets.NR_E2E_ACCOUNT_B_PASSWORD }}
      NR_E2E_ACCOUNT_B_DISPLAY_NAME: ${{ secrets.NR_E2E_ACCOUNT_B_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate isolated project configuration
        shell: bash
        run: |
          test -n "$NR_E2E_PROJECT_REF"
          test -n "$NR_E2E_SUPABASE_URL"
          test -n "$NR_E2E_PUBLISHABLE_KEY"
          test "$NR_E2E_PROJECT_REF" != 'tiqbmuubpbmxqvtkcdhq'
          [[ "$NR_E2E_SUPABASE_URL" == "https://${NR_E2E_PROJECT_REF}.supabase.co" ]]
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify and run tests
        run: |
          npm run check
          npm test
          npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
