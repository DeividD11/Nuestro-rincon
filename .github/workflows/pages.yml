name: Verify and deploy Nuestro Rincón

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependency tree
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Verify project structure and JavaScript
        run: npm run check

      - name: Audit theme contrast palette
        run: npm run check:contrast

      - name: Type-check Supabase Edge Functions
        run: npm run check:edge

      - name: Run automated tests
        run: npm test

      - name: Build static site
        run: npm run build:pages

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Run axe-core WCAG 2.2 AA checks
        run: npm run test:a11y

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: ./_site
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: ./_site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
