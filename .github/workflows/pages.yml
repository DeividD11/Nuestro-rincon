name: Verify and deploy Nuestro Rincón

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm to the lockfile toolchain
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = '11.19.1'

      - name: Install exact dependency tree
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Verify project structure and JavaScript
        run: npm run check

      - name: Audit theme contrast palette
        run: npm run check:contrast

      - name: Type-check Supabase Edge Functions
        run: npm run check:edge

      - name: Test Edge Function request validation
        run: npm run test:edge-unit

      - name: Run automated tests
        run: npm test

      - name: Enforce frontend coverage thresholds and write LCOV report
        run: npm run test:coverage

      - name: Build static site
        run: npm run build:pages

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Run axe-core WCAG 2.2 AA checks
        run: npm run test:a11y

      - name: Upload frontend coverage report
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      # El artefacto de Pages se publica desde el job de verificación. Así,
      # deploy-pages lo consulta en un job posterior y no inmediatamente
      # después de crearlo en el mismo runner (ventana de propagación de API).
      - name: Upload verified site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
