name: Security database tests (isolated Supabase)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    env:
      NR_DB_TEST_PROJECT_REF: ${{ secrets.NR_DB_TEST_PROJECT_REF }}
      NR_TEST_DATABASE_URL: ${{ secrets.NR_TEST_DATABASE_URL }}
      NR_TEST_CONFIRM_ISOLATED: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm to the lockfile toolchain
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = '11.19.1'

      - name: Install exact dependency tree
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Validate isolated database URL and required secrets
        env:
          PRODUCTION_PROJECT_REF: tiqbmuubpbmxqvtkcdhq
        run: |
          node --input-type=module <<'NODE'
          const ref = process.env.NR_DB_TEST_PROJECT_REF || '';
          const raw = process.env.NR_TEST_DATABASE_URL || '';
          if (!/^[a-z0-9]{20}$/.test(ref) || ref === process.env.PRODUCTION_PROJECT_REF) {
            throw new Error('NR_DB_TEST_PROJECT_REF debe identificar un proyecto aislado distinto de producción.');
          }
          if (process.env.NR_TEST_CONFIRM_ISOLATED !== 'YES' || !raw) {
            throw new Error('Falta confirmación explícita o NR_TEST_DATABASE_URL.');
          }
          const url = new URL(raw);
          const direct = url.hostname === `db.${ref}.supabase.co`;
          const pooler = /^[a-z0-9-]+\.pooler\.supabase\.com$/i.test(url.hostname)
            && decodeURIComponent(url.username) === `postgres.${ref}`;
          if (!['postgres:', 'postgresql:'].includes(url.protocol) || (!direct && !pooler) || !url.password) {
            throw new Error('NR_TEST_DATABASE_URL no coincide con la conexión PostgreSQL del proyecto aislado.');
          }
          NODE
      - name: Run pgTAP security tests
        run: npm run test:db
