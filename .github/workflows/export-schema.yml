name: Export Supabase public schema (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      NR_SCHEMA_SOURCE_PROJECT_REF: ${{ secrets.NR_SCHEMA_SOURCE_PROJECT_REF }}
      NR_SCHEMA_SOURCE_DATABASE_URL: ${{ secrets.NR_SCHEMA_SOURCE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Validate source database
        shell: bash
        run: |
          test -n "$NR_SCHEMA_SOURCE_PROJECT_REF"
          test -n "$NR_SCHEMA_SOURCE_DATABASE_URL"
          node --input-type=module -e "const ref=process.env.NR_SCHEMA_SOURCE_PROJECT_REF; const url=new URL(process.env.NR_SCHEMA_SOURCE_DATABASE_URL); const direct=url.hostname==='db.'+ref+'.supabase.co'; const pooler=/^[a-z0-9-]+\\.pooler\\.supabase\\.com$/i.test(url.hostname)&&decodeURIComponent(url.username)==='postgres.'+ref; if (!/^[a-z0-9]{20}$/.test(ref)||!['postgres:','postgresql:'].includes(url.protocol)||(!direct&&!pooler)||!url.password) process.exit(1);"
      - name: Export schema without data
        run: |
          mkdir -p supabase/schema
          supabase db dump --remote="$NR_SCHEMA_SOURCE_DATABASE_URL" --schema public --file supabase/schema/remote-public.sql
          test -s supabase/schema/remote-public.sql
      - name: Upload schema artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuestro-rincon-public-schema-${{ github.run_id }}
          path: supabase/schema/remote-public.sql
          if-no-files-found: error
          retention-days: 14
