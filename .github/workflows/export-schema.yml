name: Export Supabase public schema (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      NR_SCHEMA_SOURCE_PROJECT_REF: ${{ secrets.NR_SCHEMA_SOURCE_PROJECT_REF }}
      NR_SCHEMA_SOURCE_DATABASE_URL: ${{ secrets.NR_SCHEMA_SOURCE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Validate source database
        shell: bash
        run: |
          test -n "$NR_SCHEMA_SOURCE_PROJECT_REF"
          test -n "$NR_SCHEMA_SOURCE_DATABASE_URL"
          node --input-type=module -e "const ref=process.env.NR_SCHEMA_SOURCE_PROJECT_REF; const url=new URL(process.env.NR_SCHEMA_SOURCE_DATABASE_URL); if (!/^[a-z0-9]{20}$/.test(ref)) process.exit(1); if (!['postgres:','postgresql:'].includes(url.protocol) || url.hostname !== 'db.'+ref+'.supabase.co') process.exit(1);"
      - name: Export schema without data
        run: |
          mkdir -p supabase/schema
          supabase db dump --remote="$NR_SCHEMA_SOURCE_DATABASE_URL" --schema public --file supabase/schema/remote-public.sql
          test -s supabase/schema/remote-public.sql
      - name: Upload schema artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuestro-rincon-public-schema-${{ github.run_id }}
          path: supabase/schema/remote-public.sql
          if-no-files-found: error
          retention-days: 14
