name: Release Nuestro Rincón Edge Functions (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: Confirma que la migración privada de limpieza ya fue aplicada y revisada en producción
        required: true
        type: choice
        options: [NO, YES]
        default: NO

permissions:
  contents: read

concurrency:
  group: supabase-edge-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.inputs.confirm_production_release == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NR_SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.NR_SUPABASE_PROJECT_REF }}
      NR_RECONCILE_PROJECT_REF: ${{ vars.NR_RECONCILE_PROJECT_REF }}
      NR_RECONCILE_DATABASE_URL: ${{ secrets.NR_RECONCILE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm to the lockfile toolchain
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = '11.19.1'

      - name: Install exact dependency tree
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Validate target and release confirmation
        run: |
          test "$PROJECT_REF" = 'tiqbmuubpbmxqvtkcdhq'
          test "$NR_RECONCILE_PROJECT_REF" = "$PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$NR_RECONCILE_DATABASE_URL"
          test "${{ github.event.inputs.confirm_production_release }}" = 'YES'

      - name: Run all local release gates
        run: |
          npm run check
          npm run check:contrast
          npm test
          npm run test:coverage
          npm run check:edge
          npm run test:edge-unit
          npm run build:pages

      - name: Install PostgreSQL client for read-only reconciliation
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Block release unless every RPC matches the checked contract
        run: npm run supabase:reconcile:readonly

      - name: Deploy custom-auth Edge Functions
        run: |
          # verify_jwt=false se conserva en supabase/config.toml: el backend valida sus sesiones opacas.
          supabase functions deploy auth-api --project-ref "$PROJECT_REF"
          supabase functions deploy letters-api --project-ref "$PROJECT_REF"

      - name: Record deployed function inventory
        run: supabase functions list --project-ref "$PROJECT_REF"
