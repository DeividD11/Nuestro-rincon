name: Backup encrypted Supabase database

on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and upload database plus private Storage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: database-backups
    env:
      NR_BACKUP_PROJECT_REF: ${{ vars.NR_BACKUP_PROJECT_REF }}
      NR_BACKUP_DATABASE_URL: ${{ secrets.NR_BACKUP_DATABASE_URL }}
      NR_BACKUP_STORAGE_SERVICE_KEY: ${{ secrets.NR_BACKUP_STORAGE_SERVICE_KEY }}
      NR_BACKUP_AGE_RECIPIENT: ${{ vars.NR_BACKUP_AGE_RECIPIENT }}
      NR_BACKUP_S3_ENDPOINT: ${{ secrets.NR_BACKUP_S3_ENDPOINT }}
      NR_BACKUP_S3_BUCKET: ${{ vars.NR_BACKUP_S3_BUCKET }}
      NR_BACKUP_S3_REGION: ${{ vars.NR_BACKUP_S3_REGION }}
      NR_BACKUP_S3_PREFIX: nuestro-rincon
      AWS_ACCESS_KEY_ID: ${{ secrets.NR_BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NR_BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Install encryption and S3 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli postgresql-client

      - name: Create encrypted backup and verify remote object
        run: bash scripts/backup/create-backup.sh
